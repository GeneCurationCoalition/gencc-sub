name: Deploy v2 to Staging

on:
  workflow_dispatch:
    inputs:
      sub_image_tag:
        description: "gencc-sub image tag (e.g. 2.0-beta5)"
        required: true
        type: string
      search_image_tag:
        description: "gencc-search image tag (e.g. 2.0-beta4a)"
        required: true
        type: string
      db_bootstrap_mode:
        description: "Database bootstrap strategy"
        required: true
        default: "migrate_only"
        type: choice
        options:
          - migrate_only
          - restore_and_migrate
      db_restore_source:
        description: "Restore source URL (https:// or gs:// .sql.gz), required only for restore_and_migrate"
        required: false
        type: string
      confirm_restore:
        description: "Type RESTORE to allow destructive restore mode"
        required: false
        type: string
      force_regenerate_exports:
        description: "Force regenerate downloadable release exports even on a no-op deploy (no migrations applied)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging
    env:
      # Keep these in versioned workflow config for now.
      GCP_PROJECT_ID: clingen-dev
      GCP_ZONE: us-east1-b
      GCP_INSTANCE_NAME: gencc-vm
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/522856288592/locations/global/workloadIdentityPools/gencc-sub-gha/providers/gencc-sub-oidc
      GCP_DEPLOY_SERVICE_ACCOUNT: gencc-deploy@clingen-dev.iam.gserviceaccount.com
      GENCC_SUB_IMAGE_REPO: ghcr.io/genecurationcoalition/gencc-sub
      GENCC_SEARCH_IMAGE_REPO: ghcr.io/genecurationcoalition/gencc-search

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard trusted branch
        if: ${{ github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "This workflow is trusted only on refs/heads/main."
          echo "Current ref: ${GITHUB_REF}"
          exit 1

      - name: Validate inputs and derive deploy values
        id: validate
        shell: bash
        env:
          SUB_IMAGE_TAG: ${{ inputs.sub_image_tag }}
          SEARCH_IMAGE_TAG: ${{ inputs.search_image_tag }}
          DB_MODE: ${{ inputs.db_bootstrap_mode }}
          RESTORE_SOURCE: ${{ inputs.db_restore_source }}
          RESTORE_CONFIRM: ${{ inputs.confirm_restore }}
        run: |
          set -euo pipefail

          if [[ -z "${SUB_IMAGE_TAG}" || -z "${SEARCH_IMAGE_TAG}" ]]; then
            echo "sub_image_tag and search_image_tag are required."
            exit 1
          fi

          IMAGE_TAG_PATTERN='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          if [[ ! "${SUB_IMAGE_TAG}" =~ ${IMAGE_TAG_PATTERN} ]]; then
            echo "sub_image_tag is not a valid container image tag."
            exit 1
          fi
          if [[ ! "${SEARCH_IMAGE_TAG}" =~ ${IMAGE_TAG_PATTERN} ]]; then
            echo "search_image_tag is not a valid container image tag."
            exit 1
          fi

          SUB_IMAGE="${GENCC_SUB_IMAGE_REPO}:${SUB_IMAGE_TAG}"
          SEARCH_IMAGE="${GENCC_SEARCH_IMAGE_REPO}:${SEARCH_IMAGE_TAG}"

          RESTORE_FORCE="false"
          if [[ "${DB_MODE}" == "restore_and_migrate" ]]; then
            if [[ "${RESTORE_CONFIRM}" != "RESTORE" ]]; then
              echo "Refusing restore_and_migrate without confirm_restore=RESTORE"
              exit 1
            fi
            if [[ -z "${RESTORE_SOURCE}" ]]; then
              echo "db_restore_source is required when db_bootstrap_mode=restore_and_migrate"
              exit 1
            fi
            RESTORE_FORCE="true"
          fi

          echo "sub_image=${SUB_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "search_image=${SEARCH_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "db_mode=${DB_MODE}" >> "${GITHUB_OUTPUT}"
          echo "db_restore_source=${RESTORE_SOURCE}" >> "${GITHUB_OUTPUT}"
          echo "db_restore_force=${RESTORE_FORCE}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Ansible
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Prepare Ansible vault password file
        shell: bash
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANSIBLE_VAULT_PASSWORD}" ]]; then
            echo "ANSIBLE_VAULT_PASSWORD secret is required."
            exit 1
          fi
          printf '%s' "${ANSIBLE_VAULT_PASSWORD}" > "${RUNNER_TEMP}/.vault-pass"
          chmod 600 "${RUNNER_TEMP}/.vault-pass"

      - name: Create ephemeral OS Login SSH key
        id: oslogin
        shell: bash
        run: |
          set -euo pipefail

          ssh-keygen -t ed25519 -f "${RUNNER_TEMP}/oslogin_key" -N '' -C "gha-${GITHUB_RUN_ID}"

          gcloud compute os-login ssh-keys add \
            --key-file="${RUNNER_TEMP}/oslogin_key.pub" \
            --ttl=20m \
            --project="${GCP_PROJECT_ID}"

          OSLOGIN_USERNAME="$(gcloud compute os-login describe-profile \
            --project="${GCP_PROJECT_ID}" \
            --format='value(posixAccounts[0].username)')"

          if [[ -z "${OSLOGIN_USERNAME}" ]]; then
            echo "Failed to resolve OS Login username."
            exit 1
          fi

          echo "oslogin_username=${OSLOGIN_USERNAME}" >> "${GITHUB_OUTPUT}"

      - name: Build Ansible extra-vars
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg sub_image "${{ steps.validate.outputs.sub_image }}" \
            --arg search_image "${{ steps.validate.outputs.search_image }}" \
            --arg db_mode "${{ steps.validate.outputs.db_mode }}" \
            --arg db_restore_source "${{ steps.validate.outputs.db_restore_source }}" \
            --arg db_restore_force "${{ steps.validate.outputs.db_restore_force }}" \
            --arg force_regenerate_exports "${{ github.event.inputs.force_regenerate_exports }}" \
            '{
              gencc_sub_image: $sub_image,
              gencc_search_image: $search_image,
              gencc_db_bootstrap_mode: $db_mode,
              gencc_db_restore_source: $db_restore_source,
              gencc_db_restore_force: ($db_restore_force == "true"),
              gencc_force_regenerate_exports: ($force_regenerate_exports == "true")
            }' > "${RUNNER_TEMP}/extra-vars.json"

      - name: Run Ansible through standalone IAP listener
        shell: bash
        env:
          OSLOGIN_USERNAME: ${{ steps.oslogin.outputs.oslogin_username }}
        run: |
          set -euo pipefail

          SSH_CONFIG="${RUNNER_TEMP}/ansible-ssh-config"
          IAP_LOG_FILE="${RUNNER_TEMP}/iap-listener.log"
          IAP_PID=""

          cleanup() {
            STATUS=$?
            trap - EXIT

            if [[ -f "${SSH_CONFIG}" ]]; then
              ssh -F "${SSH_CONFIG}" -O exit "${GCP_INSTANCE_NAME}" >/dev/null 2>&1 || true
            fi
            if [[ -n "${IAP_PID}" ]]; then
              kill "${IAP_PID}" >/dev/null 2>&1 || true
              wait "${IAP_PID}" >/dev/null 2>&1 || true
            fi
            if [[ "${STATUS}" -ne 0 && -f "${IAP_LOG_FILE}" ]]; then
              echo "Standalone IAP listener log:"
              cat "${IAP_LOG_FILE}"
            fi

            exit "${STATUS}"
          }
          trap cleanup EXIT

          IAP_PORT="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          gcloud compute start-iap-tunnel "${GCP_INSTANCE_NAME}" 22 \
            --local-host-port="127.0.0.1:${IAP_PORT}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" > "${IAP_LOG_FILE}" 2>&1 &
          IAP_PID=$!

          IAP_READY="false"
          for _ in {1..20}; do
            if ! kill -0 "${IAP_PID}" 2>/dev/null; then
              echo "Standalone IAP listener exited before accepting connections."
              exit 1
            fi
            if bash -c "exec 3<>/dev/tcp/127.0.0.1/${IAP_PORT}" 2>/dev/null; then
              IAP_READY="true"
              break
            fi
            sleep 1
          done
          if [[ "${IAP_READY}" != "true" ]]; then
            echo "Standalone IAP listener did not become ready."
            exit 1
          fi
          if ! kill -0 "${IAP_PID}" 2>/dev/null; then
            echo "Standalone IAP listener exited after the readiness check."
            exit 1
          fi

          cat > "${SSH_CONFIG}" <<EOF
          Host ${GCP_INSTANCE_NAME}
            HostName 127.0.0.1
            Port ${IAP_PORT}
            User ${OSLOGIN_USERNAME}
            IdentityFile ${RUNNER_TEMP}/oslogin_key
            IdentitiesOnly yes
            ControlMaster auto
            ControlPersist 20m
            ControlPath ${RUNNER_TEMP}/ansible-ssh-%C
            ServerAliveInterval 30
            ServerAliveCountMax 4
            TCPKeepAlive yes
            ConnectTimeout 20
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 "${SSH_CONFIG}"

          cd deployment/ansible
          ANSIBLE_PIPELINING=true \
          ANSIBLE_SSH_ARGS="-F ${SSH_CONFIG}" \
            ansible-playbook \
              -i inventories/staging.ini \
              playbooks/site.yml \
              --vault-password-file "${RUNNER_TEMP}/.vault-pass" \
              -e @"${RUNNER_TEMP}/extra-vars.json"

      - name: Update checked-in image tags
        shell: bash
        run: |
          set -euo pipefail
          VARS_FILE="deployment/ansible/inventories/group_vars/staging/vars.yml"

          sed -Ei.bak "s|^gencc_sub_image:.*|gencc_sub_image: ${{ steps.validate.outputs.sub_image }}|" "${VARS_FILE}"
          sed -Ei.bak "s|^gencc_search_image:.*|gencc_search_image: ${{ steps.validate.outputs.search_image }}|" "${VARS_FILE}"
          rm -f "${VARS_FILE}.bak"

      - name: Open PR for pinned image updates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deploy): record deployed image tags"
          title: "chore(deploy): record deployed image tags"
          body: |
            Updates deployed image tags in `deployment/ansible/inventories/group_vars/staging/vars.yml`.

            - gencc-sub: `${{ steps.validate.outputs.sub_image }}`
            - gencc-search: `${{ steps.validate.outputs.search_image }}`
            - db mode: `${{ steps.validate.outputs.db_mode }}`
          branch: "chore/deploy-image-pins-${{ github.run_id }}"
          delete-branch: true
          add-paths: |
            deployment/ansible/inventories/group_vars/staging/vars.yml
