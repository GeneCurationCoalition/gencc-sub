---
- name: Look up deploy user UID (needed for rootless podman environment)
  ansible.builtin.command: id -u {{ gencc_deploy_user }}
  register: _gencc_deploy_uid
  changed_when: false
  when: gencc_enable_timers | bool

- name: Install timers (pubmed sync, update jobs, release, backups)
  ansible.builtin.debug:
    msg: "Installing GenCC systemd timers (deploy user UID: {{ _gencc_deploy_uid.stdout }})"
  when: gencc_enable_timers | bool

- name: Install systemd service for pubmed sync
  ansible.builtin.template:
    src: gencc-sub-pubmed-sync.service.j2
    dest: /etc/systemd/system/gencc-sub-pubmed-sync.service
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Install systemd timer for pubmed sync
  ansible.builtin.template:
    src: gencc-sub-pubmed-sync.timer.j2
    dest: /etc/systemd/system/gencc-sub-pubmed-sync.timer
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Install update genes service
  ansible.builtin.template:
    src: gencc-sub-update-genes.service.j2
    dest: /etc/systemd/system/gencc-sub-update-genes.service
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Install update genes timer
  ansible.builtin.template:
    src: gencc-sub-update-genes.timer.j2
    dest: /etc/systemd/system/gencc-sub-update-genes.timer
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Install update diseases service
  ansible.builtin.template:
    src: gencc-sub-update-diseases.service.j2
    dest: /etc/systemd/system/gencc-sub-update-diseases.service
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Install update diseases timer
  ansible.builtin.template:
    src: gencc-sub-update-diseases.timer.j2
    dest: /etc/systemd/system/gencc-sub-update-diseases.timer
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Install release service
  ansible.builtin.template:
    src: gencc-sub-release.service.j2
    dest: /etc/systemd/system/gencc-sub-release.service
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Install release timer
  ansible.builtin.template:
    src: gencc-sub-release.timer.j2
    dest: /etc/systemd/system/gencc-sub-release.timer
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Install backup service
  ansible.builtin.template:
    src: gencc-backup-db.service.j2
    dest: /etc/systemd/system/gencc-backup-db.service
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Install backup timer
  ansible.builtin.template:
    src: gencc-backup-db.timer.j2
    dest: /etc/systemd/system/gencc-backup-db.timer
    owner: root
    group: root
    mode: "0644"
  when: gencc_enable_timers | bool

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: gencc_enable_timers | bool

- name: Enable and start timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - gencc-sub-pubmed-sync.timer
    - gencc-sub-update-genes.timer
    - gencc-sub-update-diseases.timer
    - gencc-sub-release.timer
    - gencc-backup-db.timer
  when: gencc_enable_timers | bool
