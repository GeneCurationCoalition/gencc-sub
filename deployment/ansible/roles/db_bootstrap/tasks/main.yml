---
- name: Validate db bootstrap mode
  ansible.builtin.assert:
    that:
      - gencc_db_bootstrap_mode in ["migrate_only", "restore_and_migrate"]
    fail_msg: >-
      Invalid gencc_db_bootstrap_mode={{ gencc_db_bootstrap_mode | default('undefined') }}.
      Use migrate_only or restore_and_migrate.

- name: Validate restore settings when restore is enabled
  ansible.builtin.assert:
    that:
      - gencc_db_restore_force | bool
      - gencc_db_restore_source is defined
      - gencc_db_restore_source | length > 0
      - gencc_db_restore_source is match('^(https?://|gs://).+\.sql\.gz(?:[?#].*)?$')
    fail_msg: >-
      Refusing to restore DB without explicit opt-in.
      Set gencc_db_restore_force=true and gencc_db_restore_source to an https:// or gs:// .sql.gz URL.
  when: gencc_db_bootstrap_mode == "restore_and_migrate"

- name: Wait for PM2 processes after restarting the application container
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc '
      export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"
      podman exec gencc-sub pm2 pid {{ item }}
    '
  args:
    executable: /bin/bash
  register: gencc_pm2_process
  changed_when: false
  until: (gencc_pm2_process.stdout | trim) is match('^[1-9][0-9]*$')
  retries: 30
  delay: 2
  loop:
    - gencc-nginx
    - gencc-php-fpm
    - gencc-queue-worker
  when: gencc_deploy_with_maintenance_mode | bool

- name: Put the restarted portal into maintenance mode
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc '
      set -euo pipefail
      export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"
      podman exec gencc-sub php artisan down --retry=60
    '
  args:
    executable: /bin/bash
  when: gencc_deploy_with_maintenance_mode | bool

- name: Stop the restarted application queue worker
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc '
      set -euo pipefail
      export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"
      podman exec gencc-sub pm2 stop gencc-queue-worker
    '
  args:
    executable: /bin/bash
  when: gencc_deploy_with_maintenance_mode | bool

- name: Verify the restarted application queue worker is stopped
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc '
      export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"
      podman exec gencc-sub pm2 pid gencc-queue-worker
    '
  args:
    executable: /bin/bash
  register: gencc_queue_worker_pid
  changed_when: false
  failed_when: >-
    (gencc_queue_worker_pid.rc != 0)
    or ((gencc_queue_worker_pid.stdout | trim) != '0')
  when: gencc_deploy_with_maintenance_mode | bool

- name: Stop search after restarting application containers
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc '
      set -euo pipefail
      export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"
      search_load_state="$(systemctl --user show gencc-search.service --property=LoadState --value)"
      if [[ "$search_load_state" != "not-found" ]]; then
        systemctl --user stop gencc-search.service
      fi
    '
  args:
    executable: /bin/bash
  when: gencc_deploy_with_maintenance_mode | bool

- name: Verify the prepared restore dump still exists and is readable
  ansible.builtin.command: "gzip -t {{ gencc_db_restore_tmp_path | quote }}"
  changed_when: false
  when: gencc_db_bootstrap_mode == "restore_and_migrate"

- name: Drop and recreate database (destructive)
  ansible.builtin.shell: |
    set -euo pipefail
    mysql -e "DROP DATABASE IF EXISTS \`{{ gencc_mysql_database }}\`;"
    mysql -e "CREATE DATABASE \`{{ gencc_mysql_database }}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  args:
    executable: /bin/bash
  when: gencc_db_bootstrap_mode == "restore_and_migrate"

- name: Restore database from dump (gzip -> mysql)
  ansible.builtin.shell: |
    set -euo pipefail
    test -f "{{ gencc_db_restore_tmp_path }}"
    gunzip -c "{{ gencc_db_restore_tmp_path }}" | mysql "{{ gencc_mysql_database }}"
  args:
    executable: /bin/bash
  async: 7200
  poll: 0
  register: gencc_db_restore_job
  when: gencc_db_bootstrap_mode == "restore_and_migrate"

- name: Wait for database restore to complete
  ansible.builtin.async_status:
    jid: "{{ gencc_db_restore_job.ansible_job_id }}"
  register: gencc_db_restore_status
  until: gencc_db_restore_status.finished
  retries: 720
  delay: 10
  failed_when:
    - gencc_db_restore_status.finished | bool
    - (gencc_db_restore_status.rc | default(0)) != 0
  when: gencc_db_bootstrap_mode == "restore_and_migrate"

- name: Remove executable queue work copied from the source database
  ansible.builtin.command:
    argv:
      - mysql
      - "{{ gencc_mysql_database }}"
      - -e
      - TRUNCATE TABLE workers;
  changed_when: true
  when: gencc_db_bootstrap_mode == "restore_and_migrate"

- name: Clear transferable production authentication state on a sanitized restore
  ansible.builtin.shell: |
    set -euo pipefail
    mysql "{{ gencc_mysql_database }}" <<'SQL'
    UPDATE users
       SET remember_token = NULL,
           api_token = NULL,
           api_token_renewed_at = NULL,
           device_token = NULL,
           activation_token = NULL;
    TRUNCATE TABLE personal_access_tokens;
    TRUNCATE TABLE password_reset_tokens;
    TRUNCATE TABLE sessions;
    SQL
  args:
    executable: /bin/bash
  no_log: true
  when:
    - gencc_db_bootstrap_mode == "restore_and_migrate"
    - gencc_sanitize_restored_auth | bool

- name: Find persisted web sessions after a sanitized restore
  ansible.builtin.find:
    paths: "{{ gencc_data_dir }}/gencc-sub/storage/framework/sessions"
    file_type: file
  register: gencc_restored_session_files
  when:
    - gencc_db_bootstrap_mode == "restore_and_migrate"
    - gencc_sanitize_restored_auth | bool

- name: Remove persisted web sessions after a sanitized restore
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ gencc_restored_session_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - gencc_db_bootstrap_mode == "restore_and_migrate"
    - gencc_sanitize_restored_auth | bool

- name: Run Laravel migrations inside gencc-sub container
  ansible.builtin.shell: |
    set -euo pipefail
    # Avoid Ansible become_user + async (can trigger ACL/chmod issues on some controllers).
    sudo -iu {{ gencc_deploy_user }} bash -lc 'export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"; podman exec gencc-sub php artisan migrate --force'
  args:
    executable: /bin/bash
  async: 3600
  poll: 0
  register: gencc_db_migrate_job

- name: Wait for migrations to complete
  ansible.builtin.async_status:
    jid: "{{ gencc_db_migrate_job.ansible_job_id }}"
  register: gencc_db_migrate_status
  until: gencc_db_migrate_status.finished
  retries: 720
  delay: 5
  failed_when:
    - gencc_db_migrate_status.finished | bool
    - (gencc_db_migrate_status.rc | default(0)) != 0

- name: Rebuild disease mappings from current upstream sources
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc 'export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"; podman exec gencc-sub php artisan update:diseases --no-interaction'
  args:
    executable: /bin/bash
  async: 7200
  poll: 0
  register: gencc_disease_update_job

- name: Wait for disease mapping rebuild to complete
  ansible.builtin.async_status:
    jid: "{{ gencc_disease_update_job.ansible_job_id }}"
  register: gencc_disease_update_status
  until: gencc_disease_update_status.finished
  retries: 720
  delay: 10
  failed_when:
    - gencc_disease_update_status.finished | bool
    - (gencc_disease_update_status.rc | default(0)) != 0

- name: Clear application caches after database transition
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc 'export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"; podman exec gencc-sub php artisan optimize:clear'
  args:
    executable: /bin/bash

- name: Bootstrap initial release after database restore
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc 'export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"; podman exec gencc-sub php artisan gencc:release bootstrap --no-interaction'
  args:
    executable: /bin/bash
  register: gencc_release_bootstrap
  when: gencc_db_bootstrap_mode == "restore_and_migrate"
  failed_when: false  # Don't fail if bootstrap fails (may already exist)

- name: Show bootstrap result
  ansible.builtin.debug:
    msg: "{{ gencc_release_bootstrap.stdout_lines | default([]) }}"
  when:
    - gencc_db_bootstrap_mode == "restore_and_migrate"
    - gencc_release_bootstrap.stdout_lines is defined

# ---------------------------------------------------------------------------
# Refresh downloadable release exports after migrations.
#
# Run when migrations actually applied (data fixes may have changed exported
# values) or on a restore_and_migrate deploy. Skipped on no-op deploys to avoid
# the export render cost. If the cache-clear step is ever skipped, gencc-search's
# 600s TTL still self-heals the website within <=10 min.
# ---------------------------------------------------------------------------
# Regenerate unless we can positively confirm the migrate run was a no-op.
# Laravel prints "Nothing to migrate" only when no migrations ran; the match is
# lowercased so formatting changes ("Nothing to migrate." vs "INFO  Nothing to
# migrate") don't matter. Any other output -- migrations applied, an empty or
# unrecognized string -- falls through to regenerate. That default is deliberate:
# a wasted render is cheaper to recover from than silently serving stale exports.
- name: Determine whether release exports should be regenerated
  ansible.builtin.set_fact:
    gencc_should_regenerate_exports: >-
      {{
        (gencc_regenerate_exports_on_deploy | default(true) | bool)
        and (
          (gencc_force_regenerate_exports | default(false) | bool)
          or gencc_db_bootstrap_mode == "restore_and_migrate"
          or ('nothing to migrate' not in (gencc_db_migrate_status.stdout | default('') | lower))
        )
      }}

- name: Regenerate downloadable release exports from current DB state
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc 'export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"; podman exec gencc-sub php artisan gencc:release regenerate-exports --no-interaction'
  args:
    executable: /bin/bash
  register: gencc_regenerate_exports
  when: gencc_should_regenerate_exports | bool

- name: Clear gencc-search release cache markers
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -iu {{ gencc_deploy_user }} bash -lc 'export XDG_RUNTIME_DIR="/run/user/$(id -u {{ gencc_deploy_user }})"; podman exec gencc-search php artisan releases:clear-cache'
  args:
    executable: /bin/bash
  register: gencc_clear_release_cache
  when:
    - gencc_should_regenerate_exports | bool
    - not (gencc_deploy_with_maintenance_mode | bool)
  # Non-fatal: this only deletes cache markers, and gencc-search's 600s TTL
  # self-heals if it's skipped. A marker cleanup must not block nginx/timers
  # convergence in the roles that run after db_bootstrap.
  failed_when: false

- name: Show export regeneration and cache-clear output
  ansible.builtin.debug:
    msg: "{{ (gencc_regenerate_exports.stdout_lines | default([])) + (gencc_clear_release_cache.stdout_lines | default([])) }}"
  when:
    - gencc_should_regenerate_exports | bool
    - gencc_regenerate_exports.stdout_lines is defined
