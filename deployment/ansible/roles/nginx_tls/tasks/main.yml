---
- name: Install nginx + certbot + fail2ban dependencies
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - fail2ban
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Ensure GenCC secrets directory exists
  ansible.builtin.file:
    path: "{{ gencc_secrets_dir }}"
    state: directory
    owner: root
    group: "{{ gencc_deploy_user }}"
    mode: "0750"

- name: Create ACME webroot directory
  ansible.builtin.file:
    path: /var/www/acme-challenge
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy nginx security config (http-level rate limits, bot maps)
  ansible.builtin.template:
    src: gencc-security.conf.j2
    dest: /etc/nginx/conf.d/gencc-security.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Deploy nginx IP blocklist
  ansible.builtin.template:
    src: gencc-ip-blocklist.conf.j2
    dest: /etc/nginx/snippets/gencc-ip-blocklist.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Deploy nginx proxy params snippet
  ansible.builtin.template:
    src: gencc-proxy-params.conf.j2
    dest: /etc/nginx/snippets/gencc-proxy-params.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Check if Let's Encrypt certificate exists (pre-issuance)
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ gencc_letsencrypt_cert_name }}/fullchain.pem"
  register: gencc_le_cert_before
  when:
    - gencc_enable_letsencrypt | bool

- name: Check if existing Let's Encrypt certificate is still valid
  ansible.builtin.command: >
    openssl x509
    -checkend {{ gencc_certbot_valid_min_seconds }}
    -noout
    -in /etc/letsencrypt/live/{{ gencc_letsencrypt_cert_name }}/fullchain.pem
  register: gencc_le_cert_validity
  changed_when: false
  failed_when: false
  when:
    - gencc_enable_letsencrypt | bool
    - gencc_le_cert_before.stat.exists | default(false)

- name: Install temporary HTTP-only nginx config (pre-certificate)
  ansible.builtin.template:
    src: gencc-http.conf.j2
    dest: /etc/nginx/sites-available/gencc.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx
  when:
    - not (gencc_enable_letsencrypt | bool) or not (gencc_le_cert_before.stat.exists | default(false))

- name: Enable GenCC nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/gencc.conf
    dest: /etc/nginx/sites-enabled/gencc.conf
    state: link
    force: true
  notify: reload nginx

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Reload nginx (ensure on-disk config is active before certbot)
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Obtain or update Let's Encrypt certificate (HTTP-01)
  ansible.builtin.command: >
    certbot certonly
    --webroot
    --webroot-path /var/www/acme-challenge
    --non-interactive
    --agree-tos
    --cert-name {{ gencc_letsencrypt_cert_name }}
    -m {{ gencc_letsencrypt_email }}
    {% for d in gencc_letsencrypt_domains %}-d {{ d }} {% endfor %}
    --deploy-hook "systemctl reload nginx"
  register: gencc_certbot_result
  changed_when:
    - gencc_certbot_result.rc == 0
    - "'no action taken' not in (gencc_certbot_result.stdout | default(''))"
  failed_when: gencc_certbot_result.rc != 0
  retries: "{{ gencc_certbot_retries }}"
  delay: "{{ gencc_certbot_retry_delay }}"
  until: gencc_certbot_result.rc == 0
  when:
    - gencc_enable_letsencrypt | bool
    - not (gencc_le_cert_before.stat.exists | default(false)) or (gencc_le_cert_validity.rc | default(1)) != 0

- name: Check if Let's Encrypt certificate exists (post-issuance)
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ gencc_letsencrypt_cert_name }}/fullchain.pem"
  register: gencc_le_cert

- name: Install HTTPS nginx config (post-certificate)
  ansible.builtin.template:
    src: gencc-https.conf.j2
    dest: /etc/nginx/sites-available/gencc.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - gencc_enable_letsencrypt | bool
    - gencc_le_cert.stat.exists
  notify: reload nginx

- name: Validate nginx config syntax
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Render nginx config for hardening validation
  ansible.builtin.command: nginx -T
  register: gencc_nginx_rendered_config
  changed_when: false
  when:
    - gencc_enable_letsencrypt | bool
    - gencc_le_cert.stat.exists

- name: Assert hardened HTTPS nginx config is rendered
  ansible.builtin.assert:
    that:
      - "'access_log /var/log/nginx/access.log gencc' in gencc_nginx_rendered_config.stdout"
      - "'limit_req zone=general' in gencc_nginx_rendered_config.stdout"
      - "'limit_req zone=search' in gencc_nginx_rendered_config.stdout"
      - "'limit_conn conn_per_ip 30' in gencc_nginx_rendered_config.stdout"
      - "'location ^~ /api/pubmed' in gencc_nginx_rendered_config.stdout"
    fail_msg: "Rendered nginx config is missing expected GenCC hardening directives."
  when:
    - gencc_enable_letsencrypt | bool
    - gencc_le_cert.stat.exists

- name: Reload nginx with validated HTTPS config
  ansible.builtin.service:
    name: nginx
    state: reloaded
  when:
    - gencc_enable_letsencrypt | bool
    - gencc_le_cert.stat.exists

- name: Enable certbot renewal timer
  ansible.builtin.service:
    name: certbot.timer
    state: started
    enabled: true
  when: gencc_enable_letsencrypt | bool

# ---------------------------------------------------------------------------
# fail2ban
# ---------------------------------------------------------------------------

- name: Deploy fail2ban jail config
  ansible.builtin.template:
    src: fail2ban/jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Deploy fail2ban nginx rate-limit filter
  ansible.builtin.template:
    src: fail2ban/filter-nginx-ratelimit.conf.j2
    dest: /etc/fail2ban/filter.d/nginx-ratelimit.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Deploy fail2ban nginx forbidden filter
  ansible.builtin.template:
    src: fail2ban/filter-nginx-forbidden.conf.j2
    dest: /etc/fail2ban/filter.d/nginx-forbidden.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Deploy fail2ban nginx botsearch filter
  ansible.builtin.template:
    src: fail2ban/filter-nginx-botsearch.conf.j2
    dest: /etc/fail2ban/filter.d/nginx-botsearch.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
