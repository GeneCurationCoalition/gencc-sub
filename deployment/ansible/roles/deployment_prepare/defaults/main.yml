---
# A destructive restore always quiesces the application. Set this explicitly
# for a migrate-only production deployment when its migrations require a
# maintenance window.
gencc_quiesce_application: "{{ gencc_db_bootstrap_mode == 'restore_and_migrate' }}"

# Preserve the database being replaced so a failed restore can be rolled back.
gencc_pre_restore_backup: true

# Optional content pins for a rehearsed restore. Set both for the staging run
# so replacing a GCS object at the same path cannot silently change the input.
gencc_db_restore_expected_size: 0
gencc_db_restore_expected_md5: ""
