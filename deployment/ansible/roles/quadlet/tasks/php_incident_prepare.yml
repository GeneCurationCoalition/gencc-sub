---
# PHP INCIDENT 2026-10: CVE-2026-109618 / CVE-2026-109619.
# Remove in coordination with the memory-limit override and Quadlet mounts.
- name: Require finite container memory budgets with room for host services
  ansible.builtin.assert:
    that:
      - gencc_sub_memory_limit_mb | int > 0
      - gencc_search_memory_limit_mb | int > 0
      - gencc_host_memory_reserve_mb | int >= 2048
      - >-
        (gencc_sub_memory_limit_mb | int + gencc_search_memory_limit_mb | int
        + gencc_host_memory_reserve_mb | int) <= ansible_facts.memtotal_mb
    fail_msg: >-
      FPM memory_limit=-1 requires finite container caps and at least 2 GiB
      reserved for host services. Check the GenCC memory budget variables.

- name: Check for cgroup v2 memory controller
  ansible.builtin.slurp:
    src: /sys/fs/cgroup/cgroup.controllers
  register: gencc_cgroup_controllers

- name: Require cgroup v2 memory limits for rootless PHP containers
  ansible.builtin.assert:
    that:
      - "'memory' in (gencc_cgroup_controllers.content | b64decode).split()"
    fail_msg: "Refusing unlimited FPM memory without the cgroup v2 memory controller."

- name: Create host-managed PHP mitigation configuration directory
  ansible.builtin.file:
    path: "{{ gencc_php_config_dir }}"
    state: directory
    owner: root
    group: "{{ gencc_deploy_user }}"
    mode: "0755"

- name: Install persistent PHP mitigation configuration for both applications
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ gencc_php_config_dir }}/{{ item }}"
    owner: root
    group: "{{ gencc_deploy_user }}"
    mode: "0644"
  loop:
    - zz-security-hardening.ini
    - zz-security-hardening.conf
    - zz-security-search-pool.conf
