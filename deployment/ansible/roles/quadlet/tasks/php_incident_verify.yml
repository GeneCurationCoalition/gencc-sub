---
# PHP INCIDENT 2026-10: inspect running FPM, not CLI INI values alone.
- name: Verify container caps and live PHP-FPM mitigation settings after restart
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"
    podman exec -i {{ item.name | quote }} php /dev/stdin {{ item.memory_mb | int * 1048576 }} {{ item.max_children }} {{ item.mode }} \
      < {{ (gencc_php_config_dir ~ '/php-incident-verify.php') | quote }}
  args:
    executable: /bin/bash
    chdir: /
  become_user: "{{ gencc_deploy_user }}"
  loop: "{{ gencc_php_incident_targets }}"
  loop_control:
    label: "{{ item.name }} ({{ item.mode }})"
  register: gencc_php_incident_live_check
  until: gencc_php_incident_live_check.rc == 0
  # Existing entrypoints can spend several minutes fixing storage ownership.
  retries: 60
  delay: 3
  changed_when: false
