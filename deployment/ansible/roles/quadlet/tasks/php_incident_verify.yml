---
# PHP INCIDENT 2026-10: ordinary syntax checks and the patched portal version gate.
- name: Check FPM configuration and patched portal version after restart
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"
    podman exec {{ item.name | quote }} php-fpm -t
    {% if item.mode == 'patched' %}
    podman exec -i {{ item.name | quote }} php /dev/stdin
    {% endif %}
  args:
    executable: /bin/bash
    chdir: /
    stdin: "{{ lookup('file', role_path ~ '/files/php-patched-version.php') if item.mode == 'patched' else '' }}"
  become_user: "{{ gencc_deploy_user }}"
  loop: "{{ gencc_php_incident_targets }}"
  loop_control:
    label: "{{ item.name }} ({{ item.mode }})"
  register: gencc_php_incident_live_check
  until: gencc_php_incident_live_check.rc == 0
  # Existing entrypoints can spend several minutes fixing storage ownership.
  retries: 60
  delay: 3
  changed_when: false
