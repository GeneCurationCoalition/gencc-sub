---
# BEGIN PHP INCIDENT 2026-10 (see PHP-INTERIM-MITIGATION.md)
- name: Prepare interim PHP incident mitigations
  ansible.builtin.import_tasks: php_incident_prepare.yml
# END PHP INCIDENT 2026-10

- name: Write application .env files from vault
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ gencc_secrets_dir }}/{{ item.name }}.env"
    owner: root
    group: "{{ gencc_deploy_user }}"
    # NOTE: This file is mounted into the container as `/var/www/html/.env`.
    # It must be readable by the web user (e.g. www-data/nginx) inside the image.
    # Host-side access is still restricted by `gencc_secrets_dir` permissions (0750 root:gencc).
    mode: "0644"
  loop:
    - { name: "gencc-sub", content: "{{ gencc_sub_env | default('') }}" }
    - { name: "gencc-search", content: "{{ gencc_search_env | default('') }}" }
  when:
    - item.name in gencc_deploy_apps
    - gencc_deploy_write_env | bool
  no_log: true

- name: Ensure application .env files are set
  ansible.builtin.assert:
    that:
      - gencc_sub_env is defined
      - gencc_search_env is defined
      - gencc_sub_env | length > 0
      - gencc_search_env | length > 0
    fail_msg: "Set app .env contents in `deployment/ansible/inventories/group_vars/all/vault.yml` (use Ansible Vault)."
  when: gencc_deploy_write_env | bool

- name: Check preserved application environment files
  ansible.builtin.stat:
    path: "{{ gencc_secrets_dir }}/{{ item }}.env"
  loop: "{{ gencc_deploy_apps }}"
  register: gencc_preserved_env_files
  when: not (gencc_deploy_write_env | bool)

- name: Require existing nonempty environment files when preserving configuration
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.size | default(0) | int > 0
    fail_msg: "Cannot preserve a missing or empty application environment file."
  loop: "{{ gencc_preserved_env_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (gencc_deploy_write_env | bool)

- name: Ensure Quadlet directory exists for deploy user
  ansible.builtin.file:
    path: "/home/{{ gencc_deploy_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ gencc_deploy_user }}"
    group: "{{ gencc_deploy_user }}"
    mode: "0750"

- name: Install gencc-sub quadlet unit
  ansible.builtin.template:
    src: gencc-sub.container.j2
    dest: "/home/{{ gencc_deploy_user }}/.config/containers/systemd/gencc-sub.container"
    owner: "{{ gencc_deploy_user }}"
    group: "{{ gencc_deploy_user }}"
    mode: "0644"
  when: "'gencc-sub' in gencc_deploy_apps"

- name: Install gencc-search quadlet unit
  ansible.builtin.template:
    src: gencc-search.container.j2
    dest: "/home/{{ gencc_deploy_user }}/.config/containers/systemd/gencc-search.container"
    owner: "{{ gencc_deploy_user }}"
    group: "{{ gencc_deploy_user }}"
    mode: "0644"
  when: "'gencc-search' in gencc_deploy_apps"

- name: Ensure the gencc-app data directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gencc_deploy_user }}"
    group: "{{ gencc_deploy_user }}"
    mode: "0750"
  loop:
    - "{{ gencc_data_dir }}/gencc-app"
    - "{{ gencc_data_dir }}/gencc-app/data"
  when: "'gencc-app' in gencc_deploy_apps"

- name: Write the gencc-app environment file
  ansible.builtin.template:
    src: gencc-app.env.j2
    dest: "{{ gencc_secrets_dir }}/gencc-app.env"
    owner: root
    group: "{{ gencc_deploy_user }}"
    # Read by podman as the deploy user, not mounted into the container.
    mode: "0640"
  when:
    - "'gencc-app' in gencc_deploy_apps"
    - gencc_deploy_write_env | bool
  no_log: true

- name: Install gencc-app quadlet unit
  ansible.builtin.template:
    src: gencc-app.container.j2
    dest: "/home/{{ gencc_deploy_user }}/.config/containers/systemd/gencc-app.container"
    owner: "{{ gencc_deploy_user }}"
    group: "{{ gencc_deploy_user }}"
    mode: "0644"
  when: "'gencc-app' in gencc_deploy_apps"

- name: Reload user systemd for Quadlet (requires lingering)
  ansible.builtin.shell: |
    set -euo pipefail
    uid="$(id -u {{ gencc_deploy_user }})"
    export XDG_RUNTIME_DIR="/run/user/${uid}"
    systemctl --user daemon-reload
  args:
    executable: /bin/bash
  become_user: "{{ gencc_deploy_user }}"

- name: Start (or restart) quadlet services
  ansible.builtin.shell: |
    set -euo pipefail
    uid="$(id -u {{ gencc_deploy_user }})"
    export XDG_RUNTIME_DIR="/run/user/${uid}"
    systemctl --user restart {{ item }}.service
  args:
    executable: /bin/bash
  become_user: "{{ gencc_deploy_user }}"
  loop: "{{ gencc_deploy_apps }}"

# BEGIN PHP INCIDENT 2026-10
- name: Check PHP configuration after restart
  ansible.builtin.import_tasks: php_incident_verify.yml
# END PHP INCIDENT 2026-10
