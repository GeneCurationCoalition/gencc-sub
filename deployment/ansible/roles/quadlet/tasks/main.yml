---
- name: Require finite container memory budgets with room for host services
  ansible.builtin.assert:
    that:
      - gencc_sub_memory_limit_mb | int > 0
      - gencc_search_memory_limit_mb | int > 0
      - gencc_host_memory_reserve_mb | int >= 2048
      - >-
        (gencc_sub_memory_limit_mb | int + gencc_search_memory_limit_mb | int
        + gencc_host_memory_reserve_mb | int) <= ansible_facts.memtotal_mb
    fail_msg: >-
      FPM memory_limit=-1 requires finite container caps and at least 2 GiB
      reserved for host services. Check the GenCC memory budget variables.

- name: Check for cgroup v2 memory controller
  ansible.builtin.slurp:
    src: /sys/fs/cgroup/cgroup.controllers
  register: gencc_cgroup_controllers

- name: Require cgroup v2 memory limits for rootless PHP containers
  ansible.builtin.assert:
    that:
      - "'memory' in (gencc_cgroup_controllers.content | b64decode).split()"
    fail_msg: "Refusing unlimited FPM memory without the cgroup v2 memory controller."

- name: Create host-managed PHP mitigation configuration directory
  ansible.builtin.file:
    path: "{{ gencc_php_config_dir }}"
    state: directory
    owner: root
    group: "{{ gencc_deploy_user }}"
    mode: "0755"

- name: Install persistent PHP mitigation configuration for both applications
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ gencc_php_config_dir }}/{{ item }}"
    owner: root
    group: "{{ gencc_deploy_user }}"
    mode: "0644"
  loop:
    - zz-security-hardening.ini
    - zz-security-hardening.conf

- name: Write application .env files from vault
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ gencc_secrets_dir }}/{{ item.name }}.env"
    owner: root
    group: "{{ gencc_deploy_user }}"
    # NOTE: This file is mounted into the container as `/var/www/html/.env`.
    # It must be readable by the web user (e.g. www-data/nginx) inside the image.
    # Host-side access is still restricted by `gencc_secrets_dir` permissions (0750 root:gencc).
    mode: "0644"
  loop:
    - { name: "gencc-sub", content: "{{ gencc_sub_env | default('') }}" }
    - { name: "gencc-search", content: "{{ gencc_search_env | default('') }}" }
  no_log: true

- name: Ensure application .env files are set
  ansible.builtin.assert:
    that:
      - gencc_sub_env is defined
      - gencc_search_env is defined
      - gencc_sub_env | length > 0
      - gencc_search_env | length > 0
    fail_msg: "Set app .env contents in `deployment/ansible/inventories/group_vars/all/vault.yml` (use Ansible Vault)."

- name: Ensure Quadlet directory exists for deploy user
  ansible.builtin.file:
    path: "/home/{{ gencc_deploy_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ gencc_deploy_user }}"
    group: "{{ gencc_deploy_user }}"
    mode: "0750"

- name: Install gencc-sub quadlet unit
  ansible.builtin.template:
    src: gencc-sub.container.j2
    dest: "/home/{{ gencc_deploy_user }}/.config/containers/systemd/gencc-sub.container"
    owner: "{{ gencc_deploy_user }}"
    group: "{{ gencc_deploy_user }}"
    mode: "0644"

- name: Install gencc-search quadlet unit
  ansible.builtin.template:
    src: gencc-search.container.j2
    dest: "/home/{{ gencc_deploy_user }}/.config/containers/systemd/gencc-search.container"
    owner: "{{ gencc_deploy_user }}"
    group: "{{ gencc_deploy_user }}"
    mode: "0644"

- name: Reload user systemd for Quadlet (requires lingering)
  ansible.builtin.shell: |
    set -euo pipefail
    uid="$(id -u {{ gencc_deploy_user }})"
    export XDG_RUNTIME_DIR="/run/user/${uid}"
    systemctl --user daemon-reload
  args:
    executable: /bin/bash
  become_user: "{{ gencc_deploy_user }}"

- name: Start (or restart) quadlet services
  ansible.builtin.shell: |
    set -euo pipefail
    uid="$(id -u {{ gencc_deploy_user }})"
    export XDG_RUNTIME_DIR="/run/user/${uid}"
    systemctl --user restart gencc-sub.service
    systemctl --user restart gencc-search.service
  args:
    executable: /bin/bash
  become_user: "{{ gencc_deploy_user }}"

- name: Verify actual container memory caps after startup
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"
    podman exec {{ item.name }} cat /sys/fs/cgroup/memory.max
  args:
    executable: /bin/bash
    chdir: /
  become_user: "{{ gencc_deploy_user }}"
  loop:
    - { name: gencc-sub, memory_mb: "{{ gencc_sub_memory_limit_mb }}" }
    - { name: gencc-search, memory_mb: "{{ gencc_search_memory_limit_mb }}" }
  register: gencc_memory_cap_check
  changed_when: false
  failed_when: >-
    gencc_memory_cap_check.rc != 0 or
    (gencc_memory_cap_check.stdout | trim) != ((item.memory_mb | int * 1048576) | string)

- name: Validate PHP-FPM configuration after mounting mitigation files
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"
    podman exec {{ item }} php-fpm -t
    podman exec {{ item }} php -r 'exit(in_array(ini_get("session.upload_progress.enabled"), ["", "0"], true) ? 0 : 1);'
  args:
    executable: /bin/bash
    chdir: /
  become_user: "{{ gencc_deploy_user }}"
  loop:
    - gencc-sub
    - gencc-search
  changed_when: false
