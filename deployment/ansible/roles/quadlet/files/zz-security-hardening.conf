; Interim CVE-2026-109618 / CVE-2026-109619 mitigation.
; Only mount with the Quadlet cgroup memory cap. Never use RLIMIT_AS/RLIMIT_DATA.
[www]
; Prevent the same worker from consuming stale state in a later request.
pm.max_requests = 1
; Pool startup settings cannot be undone by application ini_set().
; Do not move these into per-request nginx PHP_VALUE/PHP_ADMIN_VALUE headers.
php_admin_value[memory_limit] = -1
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[max_input_vars] = 1000
php_admin_value[max_input_nesting_level] = 32
