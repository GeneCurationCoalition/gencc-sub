---
# Shared defaults for all environments.
# Environment-specific overrides live in inventories/<env>/group_vars/all/vars.yml.
# Secrets belong in the per-environment vault.yml files.

gencc_deploy_user: gencc

# Container images (override per environment)
gencc_sub_image: ghcr.io/genecurationcoalition/gencc-sub:2.0
gencc_search_image: ghcr.io/genecurationcoalition/gencc-search:2.0

# Limit configuration writes and container restarts for a targeted rollout.
gencc_deploy_apps: [gencc-sub, gencc-search]
# Runtime-only rollouts may preserve the existing host environment files.
gencc_deploy_write_env: true

# Host bind ports (nginx routes to these)
gencc_sub_port: 8080
gencc_search_port: 8081
gencc_app_port: 8082

# gencc-app, the new public browser. An environment runs it by setting
# gencc_app_hostname and gencc_app_image; deploy it with playbooks/gencc-app.yml.
gencc_app_memory_limit_mb: 1024
# The address nginx's connections reach the app from: slirp4netns's port
# forwarder, the same on every rootless VM (measured on staging, 23 October
# 2026). Trusting it lets download quotas count the client nginx names in
# X-Forwarded-For; only processes on the VM connect from it.
gencc_app_trust_proxy: 10.0.2.100

# Host paths
gencc_secrets_dir: /etc/gencc
gencc_data_dir: /var/lib/gencc

# -----------------------------------------------------------------------------
# BEGIN PHP INCIDENT 2026-10: CVE-2026-109618 / CVE-2026-109619
# See PHP-INTERIM-MITIGATION.md for coordinated removal after patching.
# Public portal traffic receives a static nginx response; jobs keep running.
gencc_php_incident_portal_offline: true
gencc_php_incident_portal_mitigations: true
# These host-managed files are mounted into BOTH apps, including existing images.
gencc_php_config_dir: /etc/gencc/php
# External caps must accompany FPM memory_limit=-1. Leave room for host MySQL.
# Incident budgets, not guaranteed capacity for concurrent exports/imports.
gencc_sub_memory_limit_mb: 3072
gencc_search_memory_limit_mb: 2048
gencc_host_memory_reserve_mb: 2048
# END PHP INCIDENT 2026-10
# -----------------------------------------------------------------------------

# MySQL
gencc_mysql_database: gencc_sub
gencc_mysql_bind_address: "127.0.0.1"
# Holds the whole database in memory (about 500 MB in October 2026, mostly the
# submissions' JSON); Ubuntu's default is 128 MB. Needing this much for this
# little data says the schema wants restructuring; don't raise it past 1G.
gencc_mysql_innodb_buffer_pool_size: 1G

# Users created in MySQL (passwords are in vault vars)
gencc_mysql_sub_user: gencc_sub_app
gencc_mysql_search_user: gencc_search_reader
gencc_mysql_app_user: gencc_app

# Container-to-host MySQL host for rootless slirp4netns
gencc_container_db_host: 10.0.2.2

# TLS
gencc_enable_letsencrypt: true
gencc_letsencrypt_email: gencc-tech@broadinstitute.org
gencc_certbot_valid_min_seconds: 0
gencc_certbot_retries: 5
gencc_certbot_retry_delay: 60

# Hostname redirects (301 → canonical). Override per-environment as needed.
gencc_submit_hostname_redirects: []
gencc_search_hostname_redirects: []

# -----------------------------------------------------------------------------
# Security hardening
# -----------------------------------------------------------------------------
# HSTS max-age in seconds (1 year). Override to 300 on staging.
gencc_hsts_max_age: 31536000

# IPs to block at nginx level (individual IPs and CIDR ranges)
gencc_blocked_ips: []
  # - 185.100.157.14
  # - 47.246.164.0/24

# -----------------------------------------------------------------------------
# Database bootstrap
# -----------------------------------------------------------------------------
# Choose one:
# - migrate_only: preserve the existing DB; only run Laravel migrations.
# - restore_and_migrate: DROP + restore DB from a .sql.gz dump, then run migrations.
gencc_db_bootstrap_mode: migrate_only

# Example restoring from a mysql dump:
# gencc_db_restore_source: "gs://gencc-dev/application-private/backups/gencc_sub_baseline_20260205.sql.gz"
# gencc_db_bootstrap_mode: restore_and_migrate
# gencc_db_restore_force: true

# -----------------------------------------------------------------------------
# Downloadable release-export refresh
# -----------------------------------------------------------------------------
# When true, regenerate the downloadable release export files (CSV/TSV/XLSX,
# current + legacy) from the current published DB state and clear the search
# app's local release-cache markers after migrations. This keeps the public
# download links in sync with data fixes applied by migrations. To avoid the
# export render cost (~35k published rows x 3 formats x 2 folders), the step
# only runs when migrations actually applied or on a restore_and_migrate deploy.
gencc_regenerate_exports_on_deploy: true
#
# Force the refresh even on a no-op deploy (no migrations applied). Use for an
# out-of-band data fix with no migration, or to recover a stale environment on
# the first deploy without faking a migration. Still gated by the master switch
# above. Exposed as the force_regenerate_exports GitHub Actions workflow input.
gencc_force_regenerate_exports: false
