---
# Shared defaults for all environments.
# Environment-specific overrides live in inventories/<env>/group_vars/all/vars.yml.
# Secrets belong in the per-environment vault.yml files.

gencc_deploy_user: gencc

# Container images (override per environment)
gencc_sub_image: ghcr.io/genecurationcoalition/gencc-sub:2.0
gencc_search_image: ghcr.io/genecurationcoalition/gencc-search:2.0

# Host bind ports (nginx routes to these)
gencc_sub_port: 8080
gencc_search_port: 8081

# Host paths
gencc_secrets_dir: /etc/gencc
gencc_data_dir: /var/lib/gencc

# MySQL
gencc_mysql_database: gencc_sub
gencc_mysql_bind_address: "127.0.0.1"

# Users created in MySQL (passwords are in vault vars)
gencc_mysql_sub_user: gencc_sub_app
gencc_mysql_search_user: gencc_search_reader

# Container-to-host MySQL host for rootless slirp4netns
gencc_container_db_host: 10.0.2.2

# TLS
gencc_enable_letsencrypt: true
gencc_letsencrypt_email: gencc-tech@broadinstitute.org
gencc_certbot_valid_min_seconds: 0
gencc_certbot_retries: 5
gencc_certbot_retry_delay: 60

# Hostname redirects (301 → canonical). Override per-environment as needed.
gencc_submit_hostname_redirects: []
gencc_search_hostname_redirects: []

# -----------------------------------------------------------------------------
# Security hardening
# -----------------------------------------------------------------------------
# HSTS max-age in seconds (1 year). Override to 300 on staging.
gencc_hsts_max_age: 31536000

# IPs to block at nginx level (individual IPs and CIDR ranges)
gencc_blocked_ips: []
  # - 185.100.157.14
  # - 47.246.164.0/24

# -----------------------------------------------------------------------------
# Database bootstrap
# -----------------------------------------------------------------------------
# Choose one:
# - migrate_only: preserve the existing DB; only run Laravel migrations.
# - restore_and_migrate: DROP + restore DB from a .sql.gz dump, then run migrations.
gencc_db_bootstrap_mode: migrate_only

# Example restoring from a mysql dump:
# gencc_db_restore_source: "gs://gencc-dev/application-private/backups/gencc_sub_baseline_20260205.sql.gz"
# gencc_db_bootstrap_mode: restore_and_migrate
# gencc_db_restore_force: true
