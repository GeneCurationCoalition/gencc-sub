---
# Non-secret defaults. Secrets belong in `vault.yml` in this same directory.

gencc_deploy_user: gencc

# Container images (override per environment)
gencc_sub_image: ghcr.io/genecurationcoalition/gencc-sub:2.0-beta2
gencc_search_image: ghcr.io/genecurationcoalition/gencc-search:2.0-beta3

# Host bind ports (nginx routes to these)
gencc_sub_port: 8080
gencc_search_port: 8081

# Host paths
gencc_secrets_dir: /etc/gencc
gencc_data_dir: /var/lib/gencc

# MySQL
gencc_mysql_database: gencc_sub
gencc_mysql_bind_address: "127.0.0.1"

# Users created in MySQL (passwords are in vault vars)
gencc_mysql_sub_user: gencc_sub_app
gencc_mysql_search_user: gencc_search_reader

# Container-to-host MySQL host for rootless slirp4netns
gencc_container_db_host: 10.0.2.2

# Public routing / TLS
gencc_domain: clingen.app
gencc_submit_hostname: "gencc-sub-stage.{{ gencc_domain }}"
gencc_search_hostname: "gencc-search-stage.{{ gencc_domain }}"

gencc_enable_letsencrypt: true
gencc_letsencrypt_email: gencc-tech@broadinstitute.org
# Store this cert under a stable name so nginx can reference it regardless of domains.
gencc_letsencrypt_cert_name: gencc-stage
gencc_letsencrypt_domains:
  - "{{ gencc_submit_hostname }}"
  - "{{ gencc_search_hostname }}"

# GCP Cloud DNS managed zone name (used by certbot DNS-01 hook scripts)
gencc_gcp_dns_zone_name: clingen-app
