---
# Staging environment overrides.

# Container images
gencc_sub_image: ghcr.io/genecurationcoalition/gencc-sub:2.1.6
gencc_search_image: ghcr.io/genecurationcoalition/gencc-search:2.1.6

# Public routing / TLS
gencc_submit_hostname: portal-stage.thegencc.org
gencc_search_hostname: search-stage.thegencc.org
gencc_letsencrypt_cert_name: gencc-stage
gencc_letsencrypt_domains:
  - "{{ gencc_submit_hostname }}"
  - "{{ gencc_search_hostname }}"

# Systemd timers for scheduled tasks
gencc_enable_timers: true

# Security: short HSTS max-age on staging (5 minutes)
gencc_hsts_max_age: 300
