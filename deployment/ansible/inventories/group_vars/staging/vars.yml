---
# Staging environment overrides.

# Container images
gencc_sub_image: ghcr.io/genecurationcoalition/gencc-sub:2.3.1
gencc_search_image: ghcr.io/genecurationcoalition/gencc-search:2.2.1
gencc_app_image: ghcr.io/genecurationcoalition/gencc:sha-d3eeede

# PHP INCIDENT 2026-10: reopen only after the patched portal passes preflight
# and FPM syntax checks.
gencc_php_incident_portal_offline: false
gencc_php_incident_portal_mitigations: false

# Public routing / TLS
gencc_submit_hostname: portal-stage.thegencc.org
gencc_search_hostname: search-stage.thegencc.org
gencc_app_hostname: browser-stage.thegencc.org
gencc_app_releases_bucket: gencc-dev
gencc_letsencrypt_cert_name: gencc-stage
gencc_letsencrypt_domains:
  - "{{ gencc_submit_hostname }}"
  - "{{ gencc_search_hostname }}"
  - "{{ gencc_app_hostname }}"

# Systemd timers for scheduled tasks
gencc_enable_timers: true

# Security: short HSTS max-age on staging (5 minutes)
gencc_hsts_max_age: 300

# Preserve deliberate password and 2FA login after a production snapshot
# restore, but remove copied sessions, bearer tokens, and reset/activation state.
gencc_sanitize_restored_auth: true
