---
# Non-secret defaults. Put secrets in `group_vars/all.vault.yml` (Ansible Vault).

gencc_deploy_user: gencc

# Container images (override per environment)
gencc_sub_image: ghcr.io/your-org/gencc-sub:latest
gencc_search_image: ghcr.io/your-org/gencc-search:latest

# Host bind ports (LB targets these)
gencc_sub_port: 8080
gencc_search_port: 8081

# Host paths
gencc_secrets_dir: /etc/gencc
gencc_data_dir: /var/lib/gencc

# MySQL
gencc_mysql_database: gencc_sub
gencc_mysql_bind_address: "127.0.0.1"

# Users created in MySQL (passwords are in vault vars)
gencc_mysql_sub_user: gencc_sub_app
gencc_mysql_search_user: gencc_search_reader

# Container-to-host MySQL host for rootless slirp4netns
gencc_container_db_host: 10.0.2.2

# Timers
gencc_enable_timers: true
gencc_pubmed_sync_interval: "6h"

gencc_update_genes_oncalendar: "daily"
gencc_update_diseases_oncalendar: "daily"
gencc_backup_oncalendar: "daily"
