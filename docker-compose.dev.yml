# Development Docker Compose for GenCC Submission Portal
# Compatible with Podman: podman-compose -f docker-compose.dev.yml up
#
# Usage:
#   podman-compose -f docker-compose.dev.yml up -d
#   podman-compose -f docker-compose.dev.yml logs -f app
#   podman-compose -f docker-compose.dev.yml down
#
# Prerequisites:
#   - Local MySQL running with gencc_sub database prepared
#   - Run scripts/backup/restore-db.sh locally first to set up the database
#
# GCS Support (optional):
#   To enable Google Cloud Storage for release files:
#   1. Run `gcloud auth application-default login` on your host machine
#   2. Add GCS env vars to your .env file (see .env.example)
#   The gcloud credentials are automatically mounted into the container

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    container_name: gencc-dev
    volumes:
      # Mount source code for hot reload
      - .:/var/www/html:Z
      # Use named volumes for dependencies to avoid overwriting
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      # Mount gcloud credentials for GCS access (optional - set up with: gcloud auth application-default login)
      # Mounted to /var/www/.config/gcloud so www-data (PHP-FPM user) can read them
      - ${HOME}/.config/gcloud:/var/www/.config/gcloud:ro
    ports:
      - "8001:8001"   # Laravel dev server
      - "5173:5173"   # Vite HMR
    # Note: For Podman on macOS, host.containers.internal auto-resolves to host
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://127.0.0.1:8001
      # Sanctum stateful domains for CSRF/session handling
      - SANCTUM_STATEFUL_DOMAINS=localhost,localhost:8001,127.0.0.1,127.0.0.1:8001
      # Session domain (empty = use request host)
      - SESSION_DOMAIN=
      # Use host machine's MySQL via Podman's built-in host resolution
      - DB_CONNECTION=mysql
      - DB_HOST=host.containers.internal
      - DB_PORT=3306
      - DB_DATABASE=gencc_sub
      - DB_USERNAME=root
      - DB_PASSWORD=password
      # Disable SSL for local MySQL connection (avoid self-signed cert issues)
      - MYSQL_ATTR_SSL_CA=
      - QUEUE_CONNECTION=database
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      # Point to gencc-search on host machine
      - RELEASE_URL=http://host.containers.internal:8000/api/release
      - SUBMIT_URL=http://host.containers.internal:8001/api/submit
      # GCS credentials (reads project/bucket from .env, uses mounted gcloud ADC)
      # Startup command copies credentials to this www-data accessible location
      - GOOGLE_APPLICATION_CREDENTIALS=/var/www/html/storage/.gcloud-credentials.json
    # Install dependencies on startup, then run dev servers
    command: >
      bash -c "
        composer install --no-interaction &&
        npm install &&
        php artisan key:generate --force --no-interaction 2>/dev/null || true &&
        rm -f public/storage &&
        php artisan storage:link &&
        if [ -f /var/www/.config/gcloud/application_default_credentials.json ]; then
          cp /var/www/.config/gcloud/application_default_credentials.json /var/www/html/storage/.gcloud-credentials.json &&
          chown www-data:www-data /var/www/html/storage/.gcloud-credentials.json &&
          chmod 600 /var/www/html/storage/.gcloud-credentials.json &&
          echo 'GCS credentials copied for www-data access';
        fi &&
        pm2-runtime ecosystem.dev.config.cjs
      "

volumes:
  vendor:
  node_modules:
