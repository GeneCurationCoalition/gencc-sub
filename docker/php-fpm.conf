; PHP-FPM configuration for running under PM2
; Overrides default Docker config that uses /proc/self/fd/2

[global]
; Log to file instead of stderr (required for PM2)
error_log = /var/www/html/storage/logs/php-fpm-error.log
log_level = warning

[www]
; Log slow requests
slowlog = /var/www/html/storage/logs/php-fpm-slow.log
request_slowlog_timeout = 10s

; Access log (optional, can be commented out to reduce I/O)
access.log = /var/www/html/storage/logs/php-fpm-access.log

; Catch worker output
catch_workers_output = yes
decorate_workers_output = no
